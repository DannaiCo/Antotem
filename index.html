<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>fin de año</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Open+Sans:ital,wght@1,600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
    }

    .contenedor-total {
      position: absolute;
      top: 0;
      left: 0;
      width: 600px;
      height: 1440px;
      transform-origin: top left;
    }

    video#fondo {
      position: absolute;
      top: 0;
      left: 0;
      width: 600px;
      height: 1440px;
      object-fit: cover;
      z-index: 0;
    }

    /* 🔻 POSICIONES ESCALADAS PROPORCIONALMENTE */

    .contenedor-frase {
      position: absolute;
      top: 899px;
      left: 67px;
      width: 457px;
      height: 29px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    #frase {
      font-size: 65px;
      color: white;
      font-family: "Open Sans", sans-serif;
      font-style: italic;
      font-weight: 200;
      letter-spacing: 2px;
      text-align: center;
    }

    .contador {
      position: absolute;
      top: 567px;
      left: 30px;
      width: 90%;
      text-align: center;
      font-size: 91px;
      font-family: "Dela Gothic One", sans-serif;
      font-weight: 600;
      color: #012BFF;
      line-height: 1;
      z-index: 2;
    }

  </style>
</head>

<body>
  <div class="contenedor-total" id="contenedor">

    <video id="fondo" autoplay muted loop playsinline>
      <source src="fondo.mp4" type="video/mp4">
    </video>

    <div class="contenedor-frase">
      <div id="frase">Cargando frase...</div>
    </div>

    <div class="contador" id="contador"></div>
  </div>

<script>

/* FRASES */

const frases = [
  "Para: Cantar goles con extraños",
  "Para: No lavar la camiseta",
  "Para: Sufrir juntos cada partido",
  "Para: Vivir 90 min eternos",
  "Para: Gritarle a la pantalla",
  "Para: Celebrar como nunca",
  "Para: Sentirse técnico"
];

let index = 0;
const elemento = document.getElementById("frase");

function cambiarFrase() {
  elemento.textContent = frases[index];
  index = (index + 1) % frases.length;
}

cambiarFrase();
setInterval(cambiarFrase, 5000);


/* CONTADOR */

const contador = document.getElementById("contador");
const fechaMundial = new Date(2026, 5, 11).getTime();

function actualizarContador() {

  const ahora = new Date().getTime();
  const diferencia = fechaMundial - ahora;

  if (diferencia <= 0) {
    contador.innerHTML = "HOY INICIA EL MUNDIAL";
    return;
  }

  const dias = Math.ceil(
    diferencia / (1000 * 60 * 60 * 24)
  );

  contador.innerHTML = dias +  "&nbsp;DÍAS";
}

actualizarContador();
setInterval(actualizarContador, 60000);


/* ESCALADO */

function escalarPantalla() {
  const escalaX = window.innerWidth / 600;
  const escalaY = window.innerHeight / 1440;
  const escala = Math.min(escalaX, escalaY);

  document.getElementById("contenedor")
    .style.transform = `scale(${escala})`;
}

window.addEventListener("resize", escalarPantalla);
escalarPantalla();

</script>
</body>
</html>
